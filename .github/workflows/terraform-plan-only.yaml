name: 'Terraform Plan Only for PRs'

on:
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch: 

permissions:
  contents: read

jobs:
  terraform:
    name: 'Terraform Plan Only for PRs'
    runs-on: ubuntu-latest

    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v4

    # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
    - name: Check Terraform token
      env:
        TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
      run: |
        if [ -z "$TF_API_TOKEN" ]; then
          echo "❌ TF_API_TOKEN is EMPTY"
          exit 1
        else
          echo "✅ TF_API_TOKEN is present"
          echo "Token length: ${#TF_API_TOKEN}"
        fi

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

    - name: Check Terraform CLI config
      run: |
        echo "HOME=$HOME"
        ls -la "$HOME/.terraform.d" 2>/dev/null || echo "No .terraform.d directory"
        find "$HOME" -name 'credentials.tfrc.json' -print 2>/dev/null

        
    - name: Terraform Init
      run: terraform init

    # Checks that all Terraform configuration files adhere to a canonical format
    - name: Terraform Format
      run: terraform fmt -check

    # Generates an execution plan for Terraform
    - name: Terraform Plan
      run: terraform plan -input=false
