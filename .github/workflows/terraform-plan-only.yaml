name: Terraform Plan Only for PRs

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform plan ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, tst, prd]
    env:
      TF_IN_AUTOMATION: "true"
      TF_WORKSPACE: dynatrace-${{ matrix.environment }}-application
      TF_VAR_environment: ${{ matrix.environment }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
      - name: Terraform Format
        run: terraform fmt -check -recursive terraform
      - name: Terraform Init
        run: terraform -chdir=terraform/components/application init -input=false
      - name: Terraform Plan
        run: |
          var_file="env/${TF_VAR_environment}.tfvars"
          args=()
          if [[ -f "terraform/components/application/${var_file}" ]]; then
            args+=("-var-file=${var_file}")
            echo "Using ${var_file}"
          else
            echo "No ${var_file}; using HCP workspace variables."
          fi
          terraform -chdir=terraform/components/application plan -input=false "${args[@]}"
