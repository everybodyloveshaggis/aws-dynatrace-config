name: Terraform

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform ${{ matrix.environment }}
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, tst, prd]
    concurrency:
      group: terraform-dynatrace-${{ matrix.environment }}-application
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_WORKSPACE: dynatrace-${{ matrix.environment }}-application
      TF_VAR_environment: ${{ matrix.environment }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
      - name: Terraform Format
        run: terraform fmt -check -recursive terraform
      - name: Terraform Init
        run: terraform -chdir=terraform/components/application init -input=false
      - name: Terraform Plan
        run: terraform -chdir=terraform/components/application plan -input=false
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform -chdir=terraform/components/application apply -auto-approve -input=false
