name: Terraform checks

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6
          terraform_wrapper: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Terraform Format
        run: terraform fmt -check -recursive terraform
      - name: Initialize without a backend
        run: terraform -chdir=terraform/components/application init -backend=false -input=false
      - name: Validate application
        run: terraform -chdir=terraform/components/application validate
      - name: Test cloud module with mocked providers
        run: |
          terraform -chdir=terraform/modules/dynatrace-aws-cloud-v2 init -backend=false -input=false
          terraform -chdir=terraform/modules/dynatrace-aws-cloud-v2 test
      - name: Test routing and ephemeral secret handling against localhost
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
